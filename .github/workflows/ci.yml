name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint
        run: shellcheck -x climweb-sync install.sh lib/*.sh tests/*.sh

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y rsync
      - name: Transport and config tests
        run: ./tests/run-tests.sh
      - name: Setup wizard tests
        run: ./tests/test-setup.sh

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install without a schedule
        run: sudo ./install.sh --no-schedule
      - name: Confirm the binary works
        run: climweb-sync --version
      - name: Confirm it fails cleanly on the unedited example config
        run: |
          if sudo climweb-sync --check; then
            echo "expected the placeholder config to be rejected" >&2
            exit 1
          fi
      - name: Uninstall
        run: sudo ./install.sh --uninstall
